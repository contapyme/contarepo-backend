name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/contapyme/contarepo-backend:latest

  deploy:
    name: Deploy to Azure
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configurar imagen en App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name contarepo-be \
              --resource-group rsg-contapyme \
              --container-image-name ghcr.io/contapyme/contarepo-backend:latest \
              --container-registry-url https://ghcr.io \
              --container-registry-user rodrigopizarro-sc \
              --container-registry-password ${{ secrets.GHCR_PAT }}

      - name: Restart App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp restart --name contarepo-be --resource-group rsg-contapyme

